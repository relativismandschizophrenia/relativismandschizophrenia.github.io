<!DOCTYPE html>
<html dir="ltr" mozdisallowselectionprint>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="google" content="notranslate">
    <title>pdfviewer</title>

    <link rel="resource" type="application/l10n" href="locale/locale.json">
    <script src="../build/pdf.mjs" type="module"></script>
    <link rel="stylesheet" href="viewer.css">
    <script src="viewer.mjs" type="module"></script>

    <style>
        /* Hide scrollbars and toolbars */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #outerContainer, #mainContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Hide any remaining UI elements */
        #toolbarViewer, #loadingBar, #printContainer, 
        #sidebarContainer, #secondaryToolbar, 
        #editorModeButtons, #editorModeSeparator, 
        .toolbarHorizontalGroup, .verticalToolbarSeparator {
            display: none !important;
        }

        /* Ensure viewer takes full space */
        #viewerContainer {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #viewer {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="outerContainer">
        <div id="mainContainer">
            <div id="viewerContainer" tabindex="0">
                <div id="viewer" class="pdfViewer"></div>
            </div>
        </div>
    </div>
</body>
</html>
