<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.css">
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: auto;
      background: #f0f0f0;
    }
    #pdf-container {
      position: relative;
      overflow: auto;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      margin: auto;
    }
    .textLayer, .annotationLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .annotationLayer a {
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="pdf-container">
    <canvas id="pdf-canvas"></canvas>
    <div id="text-layer" class="textLayer"></div>
    <div id="annotation-layer" class="annotationLayer"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    const url = 'test.pdf';

    let pdfDoc = null,
        scale = 0.5, // Adjust for default zoom
        canvas = document.getElementById('pdf-canvas'),
        ctx = canvas.getContext('2d'),
        container = document.getElementById('pdf-container'),
        textLayerDiv = document.getElementById('text-layer'),
        annotationLayerDiv = document.getElementById('annotation-layer');

    function renderPage(page) {
      const viewport = page.getViewport({ scale: scale });
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      textLayerDiv.innerHTML = '';
      annotationLayerDiv.innerHTML = '';

      textLayerDiv.style.height = `${canvas.height}px`;
      textLayerDiv.style.width = `${canvas.width}px`;
      annotationLayerDiv.style.height = `${canvas.height}px`;
      annotationLayerDiv.style.width = `${canvas.width}px`;

      page.render({ canvasContext: ctx, viewport: viewport });

      page.getTextContent().then(function(textContent) {
        pdfjsLib.renderTextLayer({
          textContent,
          container: textLayerDiv,
          viewport,
          textDivs: []
        });
      });

      page.getAnnotations().then(function(annotationsData) {
        pdfjsLib.AnnotationLayer.render({
          annotations: annotationsData,
          div: annotationLayerDiv,
          page,
          viewport,
          linkService: {
            getDestinationHash: () => '',
            navigateTo: () => {},
            getAnchorUrl: (dest) => dest,
            externalLinkTarget: pdfjsLib.LinkTarget.BLANK
          },
          renderInteractiveForms: true
        });
      });
    }

    pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
      pdfDoc = pdfDoc_;
      pdfDoc.getPage(1).then(renderPage);
    });
  </script>
</body>
</html>
