<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maksim.txt</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .crop-container {
        position: relative;
        height: 100vh;
        overflow: hidden;
      }
      .crop-container > pdfjs-viewer-element {
        position: absolute;
        top: -20px;
        left: 0;
        right: 0;
        height: calc(100vh + 20px);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="crop-container">
      <pdfjs-viewer-element 
        src="/portfolio.pdf" 
        viewer-path="/pdfjs-4.10.38-dist" 
        viewer-css-theme="DARK"
        viewer-extra-styles=" 
          #toolbarContainer, 
          #secondaryToolbar, 
          #sidebarContainer {
            height: 0px !important;
            overflow: hidden !important;
            display: none !important;
          }">
      </pdfjs-viewer-element>
    </div>
    
    <script type="module" src="https://cdn.skypack.dev/pdfjs-viewer-element"></script>
    <script>
      // Run once the DOM content is loaded.
      document.addEventListener('DOMContentLoaded', () => {
        const viewer = document.querySelector('pdfjs-viewer-element');
        if (viewer) {
          // Compute the aspect ratio.
          const aspectRatio = window.innerWidth / window.innerHeight;
          // For portrait orientation (aspectRatio < 1) set zoom to "page-width"
          if (aspectRatio < 1) {
            viewer.setAttribute('zoom', 'page-width');
          } else {
            viewer.setAttribute('zoom', '30');
          }
        }
      });
    </script>
  </body>
</html>
