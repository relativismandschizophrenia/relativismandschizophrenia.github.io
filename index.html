<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer Output</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      /* Hidden container for the background viewer */
      #hiddenViewer {
        display: none;
      }
      /* Visible output container for the extracted viewer */
      #output {
        height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Hidden PDF viewer element -->
    <div id="hiddenViewer">
      <pdfjs-viewer-element 
        src="/test.pdf" 
        viewer-path="/pdfjs-4.10.38-dist" 
        viewer-css-theme="DARK"
        zoom="30"
        viewer-extra-styles=" 
          #toolbarContainer {
            height: 0px !important;
            overflow: hidden !important;
          }
          #toolbarContainer > * {
            display: none !important;
          }
          #secondaryToolbar, 
          #sidebarContainer {
            height: 0px !important;
            overflow: hidden !important;
          }">
      </pdfjs-viewer-element>
    </div>
    
    <!-- Output container where the viewer container will be moved -->
    <div id="output"></div>
    
    <!-- Load the pdfjs-viewer-element module -->
    <script type="module" src="https://cdn.skypack.dev/pdfjs-viewer-element"></script>
    
    <script>
      window.addEventListener('load', () => {
        const pdfViewer = document.querySelector('#hiddenViewer pdfjs-viewer-element');
        
        // Listen for the 'documentloaded' event instead of 'pagerendered'
        pdfViewer.addEventListener('documentloaded', () => {
          // Log to verify the event fired
          console.log('PDF document loaded.');
          
          // Access the shadow DOM to get the internal viewer container.
          // In pdfjs-viewer-element the main container is usually identified by "viewerContainer"
          const viewerContainer = pdfViewer.shadowRoot.querySelector('#viewerContainer');
          if (viewerContainer) {
            document.getElementById('output').appendChild(viewerContainer);
            // Optionally remove the hidden viewer container once extracted
            document.getElementById('hiddenViewer').remove();
            console.log('Viewer container moved to output.');
          } else {
            console.error('viewerContainer not found in the shadow DOM.');
          }
        });
      });
    </script>
  </body>
</html>
