<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maksim.txt</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
  
      .crop-container {
        position: relative;
        height: 100vh;
        overflow: hidden;
      }
      
      .crop-container > pdfjs-viewer-element {
        position: absolute;
        top: -20px;
        left: 0;
        right: 0;
      
        height: calc(100vh + 20px);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="crop-container">
      <script>
  function updateZoomForOrientation() {
    const viewer = document.querySelector('pdfjs-viewer-element');
    if (window.innerHeight > window.innerWidth) {
<pdfjs-viewer-element 
        src="/portfolio.pdf" 
        viewer-path="/pdfjs-4.10.38-dist" 
        viewer-css-theme="DARK"
        zoom="page-width"
        viewer-extra-styles=" 
          #toolbarContainer, 
          #secondaryToolbar, 
          #sidebarContainer {
            height: 0px !important;
            overflow: hidden !important;
            display: none !important;
          }">
      </pdfjs-viewer-element>
    } else {
<pdfjs-viewer-element 
        src="/portfolio.pdf" 
        viewer-path="/pdfjs-4.10.38-dist" 
        viewer-css-theme="DARK"
        zoom="30"
        viewer-extra-styles=" 
          #toolbarContainer, 
          #secondaryToolbar, 
          #sidebarContainer {
            height: 0px !important;
            overflow: hidden !important;
            display: none !important;
          }">
      </pdfjs-viewer-element>
    }
  }
</script>
    </div>
    
    <script type="module" src="https://cdn.skypack.dev/pdfjs-viewer-element"></script>
  </body>
</html>
