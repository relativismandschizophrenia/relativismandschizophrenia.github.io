<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>viewer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    pdfjs-viewer-element {
      height: 100dvh;
    }
  </style>
</head>

<body>
  <pdfjs-viewer-element 
    src="/test.pdf" 
    viewer-path="/pdfjs-4.10.38-dist" 
    viewer-css-theme="DARK"
    zoom="30"
    viewer-extra-styles=".toolbar, #toolbarContainer, #sidebarContainer { display: none !important; }"
    >
  </pdfjs-viewer-element>

  <script type="module" src="https://cdn.skypack.dev/pdfjs-viewer-element"></script>
</body>

</html>
