<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>viewer</title>
  <style>
    body {
      margin: 0;
    }

    pdfjs-viewer-element {
      height: 100vh;
      height: 100dvh;
    }
  </style>
</head>

<body>
  <pdfjs-viewer-element 
    src="/test.pdf" 
    viewer-path="/pdfjs-4.10.38-dist" 
    page="1" 
    toolbar="false" 
    zoom="0.75">
  </pdfjs-viewer-element>

  <script type="module" src="https://cdn.skypack.dev/pdfjs-viewer-element"></script>
</body>

</html>
