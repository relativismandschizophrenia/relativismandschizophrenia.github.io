<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio PDF Viewer</title>
  <!-- Include PDF.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- Optionally include PDF.js viewer CSS for proper styling of text/annotation layers -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      text-align: center;
    }
    #pdf-container {
      position: relative;
      margin: 20px auto;
      border: 1px solid #ccc;
      width: 80%;
      height: 90vh;
      overflow: auto;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
    /* Allow text selection by enabling pointer events on the text layer.
       Set a lower z-index so that the annotation layer (with links) remains on top. */
    .textLayer {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: auto;
    }
    /* The annotation layer is placed above the text layer to ensure clickable links work */
    .annotationLayer {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: auto;
    }
    #controls {
      margin-bottom: 20px;
    }
    button {
      margin: 0 5px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="prev-page">Previous</button>
    <span>Page: <span id="page-num">1</span> / <span id="page-count">?</span></span>
    <button id="next-page">Next</button>
    <button id="zoom-out">Zoom Out</button>
    <button id="zoom-in">Zoom In</button>
  </div>
  <div id="pdf-container">
    <canvas id="pdf-canvas"></canvas>
    <div id="text-layer" class="textLayer"></div>
    <div id="annotation-layer" class="annotationLayer"></div>
  </div>

  <script>
    // Specify the workerSrc for PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    // URL of the PDF file – update with your file path or URL
    const url = 'test.pdf';

    let pdfDoc = null,
        pageNum = 1,
        pageRendering = false,
        pageNumPending = null,
        scale = 1.0, // Default zoom level
        canvas = document.getElementById('pdf-canvas'),
        ctx = canvas.getContext('2d'),
        container = document.getElementById('pdf-container'),
        textLayerDiv = document.getElementById('text-layer'),
        annotationLayerDiv = document.getElementById('annotation-layer');

    /**
     * Renders a page with interactive layers.
     * @param {number} num The page number.
     */
    function renderPage(num) {
      pageRendering = true;
      // Clear previous text and annotation layers
      textLayerDiv.innerHTML = '';
      annotationLayerDiv.innerHTML = '';
      
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({ scale: scale });
        // Set canvas dimensions
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        // Position overlay layers to match canvas size and position
        textLayerDiv.style.height = canvas.height + 'px';
        textLayerDiv.style.width = canvas.width + 'px';
        annotationLayerDiv.style.height = canvas.height + 'px';
        annotationLayerDiv.style.width = canvas.width + 'px';

        // Render PDF page into canvas context
        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        const renderTask = page.render(renderContext);

        renderTask.promise.then(function() {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });

        // Render the text layer (for selectable text)
        page.getTextContent().then(function(textContent) {
          pdfjsLib.renderTextLayer({
            textContent: textContent,
            container: textLayerDiv,
            viewport: viewport,
            textDivs: []
          });
        });

        // Render the annotation layer (for clickable links)
        page.getAnnotations().then(function(annotationsData) {
          pdfjsLib.AnnotationLayer.render({
            annotations: annotationsData,
            div: annotationLayerDiv,
            page: page,
            viewport: viewport,
            linkService: {
              // A simple link handler: open links in a new tab
              navigateTo: function(dest) {
                console.log('Navigating to destination:', dest);
              }
            },
            renderInteractiveForms: true
          });
        });
      });

      // Update page number display
      document.getElementById('page-num').textContent = num;
    }

    /**
     * Queues rendering of a page if another render is in progress.
     */
    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    /**
     * Displays the previous page.
     */
    function onPrevPage() {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    }

    /**
     * Displays the next page.
     */
    function onNextPage() {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    }

    document.getElementById('prev-page').addEventListener('click', onPrevPage);
    document.getElementById('next-page').addEventListener('click', onNextPage);

    /**
     * Zoom In and Zoom Out functions.
     */
    function zoomIn() {
      scale = scale * 1.1;
      queueRenderPage(pageNum);
    }
    function zoomOut() {
      scale = scale / 1.1;
      queueRenderPage(pageNum);
    }
    document.getElementById('zoom-in').addEventListener('click', zoomIn);
    document.getElementById('zoom-out').addEventListener('click', zoomOut);

    // Asynchronously load the PDF.
    pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
      pdfDoc = pdfDoc_;
      document.getElementById('page-count').textContent = pdfDoc.numPages;
      renderPage(pageNum);
    });
  </script>
</body>
</html>
