<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maksim.txt</title>
    <script> if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent))
{ window.location.href = "portfolio-light.pdf";} </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .crop-container {
        position: relative;
        height: 100vh;
        overflow: hidden;
        -ms-overflow-style: none; 
        scrollbar-width: none; 
      }
      .crop-container > pdfjs-viewer-element {
        position: absolute;
        top: 0;
        left: 0;
        right: -15px;
        height: 100vh;
        width: calc(100vw + 15px);
        overflow: hidden;
      }
      .body {
        overflow: hidden;
        -ms-overflow-style: none; 
        scrollbar-width: none; 
      }
      .crop-container::-webkit-scrollbar { 
        display: none; 
      }
      .body::-webkit-scrollbar { 
        display: none; 
      }
    </style>
  </head>
  <body>
    <div class="crop-container">
      <pdfjs-viewer-element 
        src="/portfolio-light.pdf" 
        viewer-path="/pdfjs-4.10.38-dist" 
        viewer-css-theme="DARK"
        zoom="30"
        viewer-extra-styles=" 
          #toolbarContainer, 
          #secondaryToolbar, 
          #sidebarContainer {
          height: 0px !important;
          overflow: hidden !important;
          display: none !important;
          }
          :root {--page-margin: 1px !important; --body-bg-color: #1b1b1b !important; --toggled-btn-color :#FFFFFF!important;}
          #viewerContainer {
          display: flex !important;
          justify-content: center !important;
          align-items: flex-start !important;
          /* background: url('grain.jpg') no-repeat center center !important; */
          background-size: cover !important;
          scrollbar-width: none !important;
          -ms-overflow-style: none !important;
          -webkit-scrollbar {display: none !important;
          }
          .textLayer {
          opacity: 1 !important;
          visibility: visible !important;
          pointer-events: auto !important;
          }">
      </pdfjs-viewer-element>
    </div>
    
    <script type="module" src="https://cdn.skypack.dev/pdfjs-viewer-element"></script>

  </body>
</html>
