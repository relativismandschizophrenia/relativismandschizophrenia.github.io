<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive PDF Viewer</title>
  <script type="module" src="https://unpkg.com/pdfjs-viewer-element"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }
    pdf-viewer {
      width: 80%;
      height: 90%;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <pdf-viewer src="test.pdf" viewer-path="pdfjs-4.10.38-dist" open></pdf-viewer>
</body>
</html>
