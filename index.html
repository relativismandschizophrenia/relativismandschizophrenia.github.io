<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      /* Crop container hides any content outside its boundaries */
      .crop-container {
        position: relative;
        height: 100vh;
        overflow: hidden;
      }
      /* Shift the viewer up by 10px so that the top 10px are hidden */
      .crop-container > pdfjs-viewer-element {
        position: absolute;
        top: -20px;
        left: 0;
        right: 0;
        /* Increase the height to cover the extra shifted area */
        height: calc(100vh + 20px);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="crop-container">
      <pdfjs-viewer-element 
        src="/test.pdf" 
        viewer-path="/pdfjs-4.10.38-dist" 
        viewer-css-theme="DARK"
        zoom="30"
        viewer-extra-styles=" 
          #toolbarContainer, 
          #secondaryToolbar, 
          #sidebarContainer {
            height: 0px !important;
            overflow: hidden !important;
            display: none !important;
          }">
      </pdfjs-viewer-element>
    </div>
    
    <script type="module" src="https://cdn.skypack.dev/pdfjs-viewer-element"></script>
  </body>
</html>
