<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive PDF Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.css">
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      background-color: #f0f0f0;
    }
    #pdf-container {
      position: relative;
      width: 80%;
      height: 80%;
      overflow: auto;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    #pdf-canvas {
      width: 100%;
      height: auto;
    }
    .textLayer, .annotationLayer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }
    .annotationLayer a {
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="pdf-container">
    <canvas id="pdf-canvas"></canvas>
    <div id="text-layer" class="textLayer"></div>
    <div id="annotation-layer" class="annotationLayer"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.js"></script>
  <script>
    const url = 'test.pdf'; // Path to your PDF file

    // Set the workerSrc property
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const container = document.getElementById('pdf-container');
    const canvas = document.getElementById('pdf-canvas');
    const textLayerDiv = document.getElementById('text-layer');
    const annotationLayerDiv = document.getElementById('annotation-layer');
    const ctx = canvas.getContext('2d');
    const scale = 1.0; // Adjust the scale for default zoom

    // Fetch the PDF document
    pdfjsLib.getDocument(url).promise.then(pdfDoc => {
      // Fetch the first page
      pdfDoc.getPage(1).then(page => {
        const viewport = page.getViewport({ scale: scale });
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        // Render the page on the canvas
        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        page.render(renderContext).promise.then(() => {
          // Render the text layer
          page.getTextContent().then(textContent => {
            pdfjsLib.renderTextLayer({
              textContent: textContent,
              container: textLayerDiv,
              viewport: viewport,
              textDivs: []
            });
          });

          // Render the annotation layer (for links)
          page.getAnnotations().then(annotationsData => {
            pdfjsLib.AnnotationLayer.render({
              annotations: annotationsData,
              div: annotationLayerDiv,
              page: page,
              viewport: viewport,
              linkService: new pdfjsLib.SimpleLinkService()
            });
          });
        });
      });
    });
  </script>
</body>
</html>
